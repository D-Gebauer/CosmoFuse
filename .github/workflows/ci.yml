name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install linters
      # Pinned to the versions the tree is checked with locally: a newer
      # black restyles, and newer numpy stubs or mypy report new errors, for
      # reasons that have nothing to do with a change under review.
      run: |
        pip install --upgrade pip
        pip install -e . numpy==2.4.6 numba==0.66.0 scipy==1.18.1 scipy-stubs==1.18.1.0 \
          black==26.10.1 isort==9.0.1 flake8==7.3.0 mypy==2.3.1

    - name: black, isort, flake8, mypy --strict
      run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        # Installs package in editable mode with 'dev' dependencies (pytest, etc.)
        pip install -e ".[dev]"

    - name: Run tests
      # Exclude GPU tests since standard runners don't have GPUs
      run: |
        pytest -m "not gpu" --cov=CosmoFuse --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        # v4 requires a token. Without one the upload fails and, with
        # fail_ci_if_error, turns the whole run red for a reason that has
        # nothing to do with the code -- so this stays false until the
        # secret is set in the repository.
        fail_ci_if_error: false
